<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>شیوری - برنامه انیمه</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        /* Bridge until React hydrates — matches BrandBootScreen (app dark chrome) */
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #121212;
            color: #f5f5f5;
            font-family: 'Vazirmatn', system-ui, sans-serif;
        }

        #boot-splash {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #121212;
            box-sizing: border-box;
        }

        #boot-splash .boot-aurora {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse 80% 55% at 15% 20%, rgba(139, 92, 246, 0.28), transparent 55%),
                radial-gradient(ellipse 70% 50% at 90% 75%, rgba(96, 165, 250, 0.18), transparent 50%),
                radial-gradient(ellipse 60% 40% at 50% 100%, rgba(167, 139, 250, 0.14), transparent 55%);
            background-size: 140% 140%;
            animation: boot-aurora-drift 14s ease-in-out infinite alternate;
        }

        #boot-splash .boot-orb {
            position: absolute;
            border-radius: 9999px;
            filter: blur(40px);
            pointer-events: none;
            opacity: 0.7;
            will-change: transform, opacity;
        }

        #boot-splash .boot-orb-a {
            width: 16rem;
            height: 16rem;
            top: 8%;
            inset-inline-end: -2rem;
            background: rgba(139, 92, 246, 0.55);
            animation: boot-orb-float-a 5.5s ease-in-out infinite alternate;
        }

        #boot-splash .boot-orb-b {
            width: 13rem;
            height: 13rem;
            bottom: 14%;
            inset-inline-start: -1.5rem;
            background: rgba(59, 130, 246, 0.45);
            animation: boot-orb-float-b 7s ease-in-out infinite alternate;
        }

        #boot-splash .boot-main {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 2rem 1.75rem 4rem;
            box-sizing: border-box;
        }

        #boot-splash .boot-logo {
            height: 1.5rem;
            width: auto;
            max-width: 6.5rem;
            opacity: 0.8;
        }

        #boot-splash blockquote {
            margin: 0 auto;
            width: 100%;
            max-width: 24rem;
            text-align: center;
            animation: boot-quote-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        #boot-splash .boot-quote {
            margin: 0;
            font-size: 1.125rem;
            font-weight: 600;
            line-height: 2rem;
            color: #f5f5f5;
        }

        #boot-splash .boot-quote .q {
            color: rgba(167, 139, 250, 0.85);
        }

        #boot-splash .boot-attr {
            margin: 1rem 0 0;
            font-size: 0.875rem;
            font-weight: 400;
            color: rgba(245, 245, 245, 0.55);
        }

        #boot-splash .boot-bar-wrap {
            position: relative;
            z-index: 1;
            padding: 0 2rem 1.5rem;
        }

        #boot-splash .boot-track {
            margin: 0 auto;
            height: 2px;
            width: 7rem;
            overflow: hidden;
            border-radius: 9999px;
            background: #3f3f46;
        }

        #boot-splash .boot-bar {
            height: 100%;
            width: 100%;
            border-radius: 9999px;
            background: #8b5cf6;
            transform-origin: right center;
            animation: boot-progress-grow 3.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes boot-aurora-drift {
            0% { background-position: 0% 40%; }
            100% { background-position: 100% 60%; }
        }

        @keyframes boot-orb-float-a {
            0% { transform: translate3d(0, 0, 0) scale(0.92); opacity: 0.45; }
            100% { transform: translate3d(-48px, 56px, 0) scale(1.18); opacity: 0.85; }
        }

        @keyframes boot-orb-float-b {
            0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.4; }
            100% { transform: translate3d(40px, -52px, 0) scale(1.22); opacity: 0.8; }
        }

        @keyframes boot-quote-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes boot-progress-grow {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            #boot-splash .boot-aurora,
            #boot-splash .boot-orb-a,
            #boot-splash .boot-orb-b,
            #boot-splash blockquote {
                animation: none !important;
            }
            #boot-splash .boot-bar {
                animation: none !important;
                transform: scaleX(1);
            }
        }
    </style>
    <!-- Early Telegram WebApp so ready() can hide the native splash before the JS bundle loads -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        (function () {
            try {
                var wa = window.Telegram && window.Telegram.WebApp
                if (!wa) return
                wa.ready()
                if (typeof wa.expand === 'function') wa.expand()
            } catch (e) { /* outside Telegram */ }
        })()
    </script>
</head>

<body>
    <div id="root">
        <div id="boot-splash" role="status" aria-live="polite" aria-busy="true">
            <div class="boot-aurora" aria-hidden="true"></div>
            <div class="boot-orb boot-orb-a" aria-hidden="true"></div>
            <div class="boot-orb boot-orb-b" aria-hidden="true"></div>
            <div class="boot-main">
                <img class="boot-logo" src="/boot-logo.svg" alt="" />
                <blockquote>
                    <p class="boot-quote" id="boot-quote-text"></p>
                    <footer class="boot-attr" id="boot-quote-attr"></footer>
                </blockquote>
            </div>
            <div class="boot-bar-wrap">
                <div class="boot-track" role="progressbar" aria-label="در حال بارگذاری">
                    <div class="boot-bar"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function () {
            /* Keep in sync with src/data/bootQuotes.ts (subset for pre-JS bridge) */
            var quotes = [
                { text: 'من نمی‌تونم شنا کنم، ولی شنا می‌کنم!', attribution: 'سورو · وان پیس' },
                { text: 'وقتی تسلیم شی، همون‌جاست که داستان تموم می‌شه.', attribution: 'ناروتو اوزوماکی · ناروتو' },
                { text: 'تو همون کسی هستی که تصمیم می‌گیری چی باشی.', attribution: 'لوفی · وان پیس' },
                { text: 'ترسیدن اشکالی نداره؛ جا زدن اشکال داره.', attribution: 'ارن یگر · اتک آن تایتان' },
                { text: 'گاهی سخت‌ترین مبارزه‌ها، با خودته.', attribution: 'تانجیرو · شیطان‌کش' },
                { text: 'باشه که مسیر تاریک باشه؛ من چراغ خودمم.', attribution: 'یوجی ایتادوری · جوجوتسو کایسن' },
                { text: 'اگر بتونی بخندی، هنوز نشکستی.', attribution: 'سایتاما · وان پانچ من' },
                { text: 'عشق یعنی وقتی برای یکی دیگه، خودت رو فراموش می‌کنی.', attribution: 'ویولت · ویولت اورگاردن' }
            ]
            var q = quotes[Math.floor(Math.random() * quotes.length)]
            window.__SHIORI_BOOT_QUOTE__ = q
            try {
                sessionStorage.setItem('shiori_boot_quote_display', JSON.stringify(q))
            } catch (e) { /* ignore */ }
            var textEl = document.getElementById('boot-quote-text')
            var attrEl = document.getElementById('boot-quote-attr')
            if (textEl) textEl.innerHTML = '<span class="q" aria-hidden="true">«</span>' + q.text + '<span class="q" aria-hidden="true">»</span>'
            if (attrEl) attrEl.textContent = '— ' + q.attribution
        })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
