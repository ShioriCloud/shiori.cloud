<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>شیوری - برنامه انیمه</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        /* Bridge until React hydrates — matches BrandBootScreen */
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #05030a;
            color: #f4f0ff;
            font-family: 'Vazirmatn', system-ui, sans-serif;
        }

        @font-face {
            font-family: 'ShioriDialogue';
            src: url('/fonts/dialogue.woff2') format('woff2');
            font-weight: 400 700;
            font-style: normal;
            font-display: swap;
        }

        #boot-splash {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #05030a;
            box-sizing: border-box;
            color: #f4f0ff;
        }

        #boot-splash .boot-scene {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        #boot-splash .boot-hero-img {
            position: absolute;
            inset-inline: 0;
            top: -4%;
            width: 100%;
            height: 58%;
            object-fit: cover;
            object-position: center 28%;
            opacity: 0.95;
            mask-image: linear-gradient(to bottom, #000 42%, transparent 96%);
            -webkit-mask-image: linear-gradient(to bottom, #000 42%, transparent 96%);
        }

        #boot-splash .boot-scene-veil {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 45% at 50% 18%, rgba(139, 92, 246, 0.22), transparent 60%),
                linear-gradient(to bottom, rgba(5, 3, 10, 0.15) 0%, rgba(5, 3, 10, 0.55) 42%, #05030a 68%);
        }

        #boot-splash .boot-content {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.25rem 1.5rem;
            box-sizing: border-box;
        }

        #boot-splash .boot-copy {
            width: 100%;
            max-width: 20rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: boot-quote-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        #boot-splash .boot-quote {
            margin: 0;
            font-family: 'ShioriDialogue', 'Vazirmatn', serif;
            font-size: clamp(1.15rem, 4.6vw, 1.32rem);
            font-weight: 500;
            line-height: 2.05;
            color: #f4f0ff;
            text-shadow: 0 2px 18px rgba(5, 3, 10, 0.95);
            text-wrap: balance;
        }

        #boot-splash .boot-credit {
            margin: 1rem 0 0;
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(196, 181, 253, 0.62);
        }

        #boot-splash .boot-footer {
            margin-top: auto;
            width: 100%;
            max-width: 14rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.65rem;
            padding-top: 2rem;
        }

        #boot-splash .boot-bar {
            width: 100%;
            height: 2px;
            overflow: hidden;
            border-radius: 9999px;
            background: rgba(76, 50, 120, 0.22);
        }

        #boot-splash .boot-bar-fill {
            height: 100%;
            width: 18%;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(124, 58, 237, 0.45), rgba(167, 139, 250, 0.55));
            animation: boot-bar-pulse 1.6s ease-in-out infinite;
        }

        #boot-splash .boot-status {
            margin: 0;
            font-size: 0.72rem;
            font-weight: 500;
            color: rgba(196, 181, 253, 0.58);
        }

        @keyframes boot-quote-in {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes boot-bar-pulse {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.65; }
        }

        @media (prefers-reduced-motion: reduce) {
            #boot-splash .boot-copy,
            #boot-splash .boot-bar-fill {
                animation: none !important;
            }
        }
    </style>
    <!-- Self-hosted WebApp script — telegram.org CDN often fails behind Telegram's built-in proxy. -->
    <script src="/telegram-web-app.js"></script>
    <script>
        (function () {
            try {
                function hasTelegramLaunchParams() {
                    try {
                        var href = String(location.href || '')
                        return /(?:^|[?#&])tgWebApp(?:Data|Platform|Version)=/.test(href)
                    } catch (e) {
                        return false
                    }
                }
                function hasStoredTelegramParams() {
                    try {
                        var raw = sessionStorage.getItem('__telegram__initParams')
                        return !!(raw && /tgWebApp(?:Data|Platform|Version)/.test(raw))
                    } catch (e) {
                        return false
                    }
                }
                function isLikelyTelegram() {
                    if (window.TelegramWebviewProxy) return true
                    if (hasTelegramLaunchParams()) return true
                    if (hasStoredTelegramParams()) return true
                    if (/Telegram/i.test(String(navigator.userAgent || ''))) return true
                    var wa = window.Telegram && window.Telegram.WebApp
                    if (!wa) return false
                    if (String(wa.initData || '').trim()) return true
                    var platform = String(wa.platform || '').toLowerCase()
                    var known = {
                        android: 1, android_x: 1, ios: 1, macos: 1, tdesktop: 1,
                        web: 1, weba: 1, webk: 1, unigram: 1, windows: 1, linux: 1
                    }
                    return !!(platform && known[platform])
                }
                var wa = window.Telegram && window.Telegram.WebApp
                // Do NOT hard-gate on empty initData — proxy WebViews often populate it late.
                // Only show the official-Telegram screen when we have no Telegram signals at all.
                if (!isLikelyTelegram()) {
                    document.documentElement.classList.add('outside-telegram')
                    return
                }
                if (wa && typeof wa.ready === 'function') wa.ready()
                var platform = String((wa && wa.platform) || '').toLowerCase()
                var isDesktop = ['tdesktop', 'macos', 'web', 'weba', 'webk', 'unigram'].indexOf(platform) >= 0
                if (isDesktop && wa && wa.isFullscreen && typeof wa.exitFullscreen === 'function') {
                    wa.exitFullscreen()
                }
            } catch (e) {
                // Leave boot to the app bundle — do not force the error gate.
            }
        })()
    </script>
    <style>
        .outside-telegram #root { display: none !important; }
        .outside-telegram #tg-gate { display: flex !important; }
    </style>
</head>

<body>
    <div id="tg-gate" style="display:none;position:fixed;inset:0;z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:1.25rem;background:#05030a;color:#f4f0ff;font-family:'Vazirmatn',system-ui,sans-serif;text-align:center;padding:2rem;">
        <p style="margin:0;font-size:1.05rem;line-height:1.9;color:rgba(244,240,255,0.85);">
            برای استفاده از مینی‌اپ، لطفاً از <strong style="font-weight:600;color:#f4f0ff;">آخرین نسخهٔ رسمی تلگرام</strong> استفاده کنید.
        </p>
    </div>
    <div id="root">
        <div id="boot-splash" role="status" aria-live="polite" aria-busy="true">
            <div class="boot-scene" aria-hidden="true">
                <img class="boot-hero-img" src="/boot-splash-hero.png" alt="" />
                <div class="boot-scene-veil"></div>
            </div>
            <div class="boot-content">
                <div class="boot-copy">
                    <blockquote style="margin:0;width:100%;">
                        <p class="boot-quote" id="boot-quote-text"></p>
                        <footer class="boot-credit" id="boot-credit"></footer>
                    </blockquote>
                </div>
                <div class="boot-footer">
                    <div class="boot-bar" role="progressbar" aria-label="در حال آماده‌سازی">
                        <div class="boot-bar-fill"></div>
                    </div>
                    <p class="boot-status">در حال آماده‌سازی…</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function () {
            /* Keep in sync with src/data/bootQuotes.ts (subset for pre-JS bridge) */
            var fallback = [
                { text: 'من نمی‌تونم شنا کنم، ولی شنا می‌کنم!', attribution: 'سورو · وان پیس' },
                { text: 'وقتی تسلیم شی، همون‌جاست که داستان تموم می‌شه.', attribution: 'ناروتو اوزوماکی · ناروتو' },
                { text: 'تو همون کسی هستی که تصمیم می‌گیری چی باشی.', attribution: 'لوفی · وان پیس' },
                { text: 'ترسیدن اشکالی نداره؛ جا زدن اشکال داره.', attribution: 'ارن یگر · اتک آن تایتان' },
                { text: 'گاهی سخت‌ترین مبارزه‌ها، با خودته.', attribution: 'تانجیرو · شیطان‌کش' },
                { text: 'باشه که مسیر تاریک باشه؛ من چراغ خودمم.', attribution: 'یوجی ایتادوری · جوجوتسو کایسن' },
                { text: 'اگر بتونی بخندی، هنوز نشکستی.', attribution: 'سایتاما · وان پانچ من' },
                { text: 'عشق یعنی وقتی برای یکی دیگه، خودت رو فراموش می‌کنی.', attribution: 'ویولت · ویولت اورگاردن' }
            ]
            function splitAttr(attribution) {
                var parts = String(attribution || '').split(/\s*[·|｜]\s*/).map(function (p) {
                    return p.trim()
                }).filter(Boolean)
                if (parts.length >= 2) {
                    return { character: parts[0], series: parts.slice(1).join(' · ') }
                }
                return { character: String(attribution || '').trim(), series: null }
            }
            var quotes = fallback
            try {
                var cached = JSON.parse(localStorage.getItem('shiori_boot_quotes_v2') || 'null')
                if (Array.isArray(cached) && cached.length) quotes = cached
            } catch (e) { /* ignore */ }
            var q = quotes[Math.floor(Math.random() * quotes.length)] || fallback[0]
            window.__SHIORI_BOOT_QUOTE__ = q
            try {
                sessionStorage.setItem('shiori_boot_quote_display', JSON.stringify(q))
            } catch (e) { /* ignore */ }
            var parts = splitAttr(q.attribution)
            var textEl = document.getElementById('boot-quote-text')
            var creditEl = document.getElementById('boot-credit')
            var quoteText = String(q.text || '')
            var words = quoteText.trim().split(/\s+/).filter(Boolean)
            if (words.length >= 2) {
                var head = words.slice(0, -2).join(' ')
                var tail = words[words.length - 2] + '\u00A0' + words[words.length - 1]
                quoteText = head ? (head + ' ' + tail) : tail
            }
            if (textEl) textEl.textContent = quoteText
            if (creditEl) creditEl.textContent = parts.series ? (parts.character + ' · ' + parts.series) : parts.character
        })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
