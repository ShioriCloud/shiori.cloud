<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>شیوری - برنامه انیمه</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        /* Bridge until React hydrates — IGN-style dialogue panel (matches BrandBootScreen) */
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #E85D4C;
            font-family: 'Vazirmatn', system-ui, sans-serif;
        }

        #boot-splash {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #E85D4C;
            padding: 0 1.75rem;
            box-sizing: border-box;
        }

        #boot-splash blockquote {
            margin: 0 auto;
            width: 100%;
            max-width: 28rem;
            color: #fff;
            text-align: right;
        }

        #boot-splash .boot-quote {
            margin: 0;
            font-size: 1.65rem;
            font-weight: 800;
            line-height: 1.35;
            letter-spacing: -0.01em;
        }

        #boot-splash .boot-attr {
            margin: 1.25rem 0 0;
            font-size: 1rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }
    </style>
    <!-- Early Telegram WebApp so ready() can hide the native splash before the JS bundle loads -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        (function () {
            try {
                var wa = window.Telegram && window.Telegram.WebApp
                if (!wa) return
                wa.ready()
                if (typeof wa.expand === 'function') wa.expand()
            } catch (e) { /* outside Telegram */ }
        })()
    </script>
</head>

<body>
    <div id="root">
        <div id="boot-splash" role="status" aria-live="polite" aria-busy="true">
            <blockquote>
                <p class="boot-quote" id="boot-quote-text"></p>
                <footer class="boot-attr" id="boot-quote-attr"></footer>
            </blockquote>
        </div>
    </div>
    <script>
        (function () {
            /* Keep in sync with src/data/bootQuotes.ts (subset for pre-JS bridge) */
            var quotes = [
                { text: 'من نمی‌تونم شنا کنم، ولی شنا می‌کنم!', attribution: 'سورو · وان پیس' },
                { text: 'وقتی تسلیم شی، همون‌جاست که داستان تموم می‌شه.', attribution: 'ناروتو اوزوماکی · ناروتو' },
                { text: 'تو همون کسی هستی که تصمیم می‌گیری چی باشی.', attribution: 'لوفی · وان پیس' },
                { text: 'ترسیدن اشکالی نداره؛ جا زدن اشکال داره.', attribution: 'ارن یگر · اتک آن تایتان' },
                { text: 'گاهی سخت‌ترین مبارزه‌ها، با خودته.', attribution: 'تانجیرو · شیطان‌کش' },
                { text: 'باشه که مسیر تاریک باشه؛ من چراغ خودمم.', attribution: 'یوجی ایتادوری · جوجوتسو کایسن' },
                { text: 'اگر بتونی بخندی، هنوز نشکستی.', attribution: 'سایتاما · وان پانچ من' },
                { text: 'عشق یعنی وقتی برای یکی دیگه، خودت رو فراموش می‌کنی.', attribution: 'ویولت · ویولت اورگاردن' }
            ]
            var q = quotes[Math.floor(Math.random() * quotes.length)]
            var textEl = document.getElementById('boot-quote-text')
            var attrEl = document.getElementById('boot-quote-attr')
            if (textEl) textEl.textContent = '«' + q.text + '»'
            if (attrEl) attrEl.textContent = '—' + q.attribution
        })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
